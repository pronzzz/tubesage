version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubesage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubesage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tubesage_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tubesage}:${POSTGRES_PASSWORD:-tubesage_secret}@db:5432/${POSTGRES_DB:-tubesage_db}
      REDIS_URL: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      OAUTH_CLIENT_SECRETS_FILE: ${OAUTH_CLIENT_SECRETS_FILE:-client_secrets.json}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
